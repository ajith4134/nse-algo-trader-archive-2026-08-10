[project]
name = "nse-algo-trader"
version = "0.1.0"
description = "Autonomous intraday algo trading bot for NSE cash and options"
requires-python = ">=3.11"
dependencies = [
    "kiteconnect>=5.0.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
    "pyotp>=2.9",
    # ICICI Direct Breeze — 1-second historical source (§53 slice 4). Only the
    # composition root / verification script imports breeze_connect (its import
    # does network I/O); the adapter takes an injected client and never imports it.
    "breeze-connect>=1.0.69",
    # Trunk VIII Global Workspace broadcast bus (research/123): the vendored pub/sub bus — the one
    # production-usable OSS piece the sourcing pass found (MIT, Pallets/Flask-proven). Receivers must
    # connect weak=False (blinker's default weak refs GC lambda receivers before send).
    "blinker>=1.9",
    # Used directly for statistical primitives: Stouffer-Z (sentience/cross_modal_binding) + the
    # two-proportion z-test (epistemics/contradiction_resolver). Declared explicitly (research/133).
    "scipy>=1.11",
    # Trunk II SENSES sentiment/news ingestion (research/140 S1): RSS/Atom parsing for the tier-1
    # financial-news feeds. The strongest maintained pure-Python feed parser (research/138).
    "feedparser>=6.0",
    # Trunk II SENSES S4a rendered-page news (research/143): headless-Chromium render of stale-RSS/
    # feed-less pages. Crawl4AI (arun_many streaming, ARM64-verified on this box) pulls in patchright
    # + beautifulsoup4 + lxml; the render sits behind a DI seam (only prod imports crawl4ai). Requires
    # a one-time `crawl4ai-setup` / `patchright install chromium` for the browser binary.
    "crawl4ai>=0.9",
    "beautifulsoup4>=4.12",
    # Trunk II SENSES S4b fast news acquisition (research/144): curl_cffi impersonates a real Chrome
    # TLS/JA3 fingerprint — the top ban-resistance fix (research/143 Agent C) + ~130× faster than a
    # Chromium render (0.3s vs 40s). The FAST rung of the acquisition ladder; behind a DI seam.
    "curl_cffi>=0.7",
    # Trunk II SENSES headline sentiment (research/150): finance-lexicon-boosted VADER (light, pure-
    # Python, no torch) — the polarity half of the sense + the directional S7 gate. FinBERT (~1.75 GB)
    # is the queued accuracy upgrade behind the same DI seam (user-gated install).
    "vaderSentiment>=3.3",
    # Trunk IX PREDICTIVE-CORE ML win-probability engine (research/156): real trained model stack.
    "lightgbm>=4.4",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "joblib>=1.3",
    # Trunk II SENSES headline sentiment — FinBERT primary scorer (ProsusAI/finbert, 91-93% F1 on India
    # news, research/138/150) behind the HeadlineSentimentScorer seam; falls back to finance-VADER if the
    # model can't load. Model (~440MB) downloads on first use. Runs CPU-only on this ARM64 box.
    "transformers>=4.40",
    "torch>=2.2",
    # Trunk III WILL — Capital-Allocation Optimizer (research/161/163): the CVXPY convex-solver substrate
    # (CLARABEL/HiGHS/SCS on aarch64) + Riskfolio-Lib's objective/constraint zoo (Mean-CVaR/MV/Risk-Parity)
    # + PyPortfolioOpt's DiscreteAllocation for integer lot rounding. ARM64-wheel-verified (research/161).
    "cvxpy>=1.9",
    "riskfolio-lib>=7.3",
    "pyportfolioopt>=1.5",
    # Trunk X AUTOPOIESIS — component-lifecycle homeostat (research/168/169/170/172). Sourced under the
    # Rule O.1a evidence tiers (research/171): every pick below is tier-1 (mechanical) or tier-2 (source
    # read / ran on real input), never a README impression.
    # · lifelines  — right-censored Weibull-AFT survival regression for remaining-useful-life. Tier-2:
    #   ran on our regime (2/10 failures, 80% censored) → converged, rho=1.857, RUL rank-ordered.
    # · pybreaker  — CLOSED/OPEN/HALF_OPEN circuit breaker per component. Tier-2: its test suite really
    #   exercises HALF_OPEN. Caveat: OpenSSF Maintained 0/10 — vendor it if upstream stalls.
    # · tenacity   — repair-retry with decorrelated-jitter backoff (AWS formula) + retry budget.
    # · river      — streaming drift detection (ADWIN/Page-Hinkley), same idiom as surprise_monitor.
    # · psutil     — real process/host telemetry (CPU, RSS, fds, disk) for the metabolic accounting.
    # · APScheduler— real cadence scheduling, replacing the hand-listed _maybe_run_* pattern.
    "lifelines>=0.30",
    "pybreaker>=1.4",
    "tenacity>=9.1",
    "river>=0.25",
    "psutil>=7.0",
    "APScheduler>=3.11",
    # Pre-existing UNDECLARED dependencies, both already installed and imported in prod code — the gap
    # research/166 flagged and research/168 re-confirmed. Declared here rather than left implicit.
    "networkx>=3.6",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pandas-ta-classic>=0.6",
    # Numerical CROSS-CHECK only, never a runtime dependency (research/168 §6, research/172 §10):
    # pymdptoolbox verifiably still runs on numpy 2.5.1/aarch64 but is sdist-only, 1148d stale,
    # OpenSSF 2.0 — used in tests to independently confirm our hand-rolled value iteration.
    "pymdptoolbox>=4.0b3",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]

# Execution-grounded quality gates (research/159). Pragmatic, not zealotry — real bug-catching on the
# code being built, without demanding a boil-the-ocean cleanup of the 233 pre-existing modules.
[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["F", "E", "W", "B", "C4", "SIM", "UP", "PIE"]  # pyflakes, pycodestyle, bugbear, comprehensions, simplify, pyupgrade
ignore = ["E501", "SIM108", "B008", "UP042"]  # line-len via formatter; ternary/default-call fine; str+Enum is a valid idiom here

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B", "SIM"]
"scripts/**" = ["B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true      # 3rd-party stubs absent (lightgbm, curl_cffi, etc.) — don't drown in them
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = false          # pragmatic: catch real errors in typed code; don't force annotations repo-wide
