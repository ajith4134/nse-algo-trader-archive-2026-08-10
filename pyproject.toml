[project]
name = "nse-algo-trader"
version = "0.1.0"
description = "Autonomous intraday algo trading bot for NSE cash and options"
requires-python = ">=3.11"
dependencies = [
    "kiteconnect>=5.0.1",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
